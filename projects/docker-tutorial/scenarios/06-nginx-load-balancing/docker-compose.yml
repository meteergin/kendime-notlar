version: '3.8'

services:
  app:
    build: ../01-professional-builder
    expose:
      - "8080" # Dışarıya port açma, sadece içeriden (Nginx) erişilsin
    networks:
      - lb-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - lb-net

networks:
  lb-net:
